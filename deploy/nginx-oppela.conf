# Oppela!! - sito Laravel (installato da deploy/installa-server.sh)
server {
    listen 80;
    listen [::]:80;
    server_name _;                 # deploy/attiva-dominio.sh imposta il dominio e l'HTTPS

    root __APP_DIR__/public;
    index index.php;
    charset utf-8;

    # foto dal telefono fino a 15 MB l'una (più margine per più foto insieme)
    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # foto, stili, font e video: in cache nel browser per 30 giorni
    location ~* \.(?:jpe?g|png|webp|avif|gif|svg|ico|css|js|woff2?|mp4)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php__PHP_VER__-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # niente accesso a file nascosti (.env, .git, .user.ini ...)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
